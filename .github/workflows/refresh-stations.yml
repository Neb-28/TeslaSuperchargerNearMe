name: Refresh stations

# Every night: check the Supercharger list against supercharge.info, refresh the stations outside
# the US and find nearby places for new stations (app/scripts/refresh-stations.mjs). When the data
# changed and the tests pass, the update is committed to main, which deploys the site. A feed that
# looks broken stops the run before anything is written (the scripts' safety brakes), and GitHub
# emails the repo owner when a run fails.
on:
  schedule:
    - cron: "17 8 * * *" # 08:17 UTC: about 4 am Eastern, 1 am Pacific
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-stations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Refresh station data
        run: node scripts/refresh-stations.mjs
        env:
          REFRESH_SUMMARY: ${{ runner.temp }}/summary.txt

      - name: Check the updated data
        run: |
          npx tsc --noEmit -p .
          npm test

      - name: Commit and push when the data changed
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "No station changes tonight."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Nightly station refresh ($(date -u +%F))" -m "$(cat "$RUNNER_TEMP/summary.txt")"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Optional: a Vercel deploy hook (Project Settings > Git > Deploy Hooks), saved as the
      # VERCEL_DEPLOY_HOOK repository secret, in case Vercel doesn't deploy commits made by this bot.
      - name: Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"; else echo "No deploy hook set; the push deploys."; fi
